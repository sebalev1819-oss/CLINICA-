# RehabMed ERP — Configuración Netlify
# Sin build step: Netlify sirve los estáticos directamente.

[build]
  publish = "."
  # No hay build command porque es HTML/JS puro (ESM nativo)

# Redirect: la app es single-page; cualquier ruta sirve el HTML principal
[[redirects]]
  from = "/*"
  to = "/RehabMed_ERP_1.html"
  status = 200

# Headers de seguridad básicos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache agresivo para los .js (cambian poco)
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
